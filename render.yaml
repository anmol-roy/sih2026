services:
  - type: web
    name: ip-sakti
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: "10000"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
